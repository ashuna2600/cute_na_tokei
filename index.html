<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local-Time Visualizer Edition v2.2</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * { touch-action: manipulation; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'DotGothic16', sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; position: relative; }
    
    #visualizer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    #ui-layer { position: relative; z-index: 10; width: 100%; max-width: 400px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; overflow-x: hidden;}
    #ui-layer > * { pointer-events: auto; }

    #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; display: flex; justify-content: center; align-items: center; }
    #enter-btn { font-family: 'DotGothic16', sans-serif; font-size: 2rem; background: transparent; color: #0f0; border: 2px solid #0f0; padding: 15px 40px; cursor: pointer; text-shadow: 0 0 10px #0f0; box-shadow: 0 0 15px rgba(0,255,0,0.3); }

    #clock-container { background: rgba(0,0,0,0.7); padding: 10px 20px; border: 2px solid #808080; border-right-color: #fff; border-bottom-color: #fff; margin-top: 10px; text-align: center; width: 100%; }
    #date-display { font-size: 1rem; color: #c0c0c0; letter-spacing: 0.1em; }
    #time-display { font-size: 3.5rem; color: #0f0; text-shadow: 0 0 10px #0f0; line-height: 1; }
    
    .control-panel { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; color: #000; padding: 10px; width: 100%; margin-top: 10px; }
    .panel-row { margin-bottom: 8px; display: flex; align-items: center; gap: 5px; font-size: 0.9rem;}
    select, button, input[type="time"], input[type="text"] { font-family: 'DotGothic16', sans-serif; font-size: 0.9rem; background: #dfdfdf; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 2px 4px; }
    button:active { border-color: #000 #fff #fff #000; background: #a0a0a0; }
    input[type="text"] { flex: 1; cursor: text; user-select: auto; -webkit-user-select: auto;}

    .mute-tabs { display: flex; width: 100%; margin-top: 5px; }
    .mute-tab { flex: 1; padding: 5px 0; font-size: 0.8rem; text-align: center; background: #dfdfdf; border: 2px solid; border-color: #fff #808080 #808080 #fff; cursor: pointer; }
    .mute-tab.active { background: #fff; border-color: #808080 #fff #fff #808080; font-weight: bold; color: #d00;}
    #alarm-status { font-size: 0.8rem; color: #d00; font-weight: bold; text-align: right; margin-top: 2px; }

    .yt-panel { background: #000080; color: #fff; padding: 8px; border: 2px inset #808080; margin-top: 5px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 5px; }
    .yt-row { display: flex; gap: 5px; }
    #yt-status { color: #0ff; font-size: 0.7rem; text-align: right; }

    .voice-btn-base { background: #c0c0c0; border: 3px solid; border-color: #fff #555 #555 #fff; padding: 10px; margin-top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .voice-btn-label { color: #000; font-size: 0.8rem; margin-bottom: 5px; font-weight: bold; }
    #random-voice-btn { font-size: 2rem; background: #000; border: 3px inset #808080; color: #0f0; text-shadow: 0 0 10px #0f0; cursor: pointer; padding: 5px 30px; }

    .weather-panel { background: #111; color: #0ff; border: 2px solid #808080; border-right-color: #fff; border-bottom-color: #fff; padding: 5px; width: 100%; margin-top: 10px; font-size: 0.8rem; display: flex; justify-content: space-around; text-align: center; }
    .weather-box { display: flex; flex-direction: column; align-items: center; width: 45%; }
    .w-label { color: #aaa; font-size: 0.7rem; margin-bottom: 2px;}
    .w-temp { font-size: 1.2rem; color: #fff; }
    .w-desc { font-size: 0.8rem; }
    .weather-divider { width: 1px; background: #555; height: 40px; margin: auto 0; }

    .ad-banner-h { background: yellow; color: red; border: 2px dashed red; width: 100%; height: 50px; margin-top: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; animation: blink 1s infinite; cursor: pointer; flex-shrink: 0;}
    @keyframes blink { 0%, 100% { background: yellow; color: red; } 50% { background: red; color: yellow; } }

    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    .window-box { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; width: 95%; max-width: 500px; padding: 2px; color: #000; text-align: center;}
    .window-title-bar { background: #000080; color: #fff; padding: 3px 5px; font-size: 0.9rem; display: flex; justify-content: space-between; font-weight: bold; }
    .window-close { background: #c0c0c0; color: #000; border: 1px solid #fff; border-right-color: #000; border-bottom-color: #000; padding: 0 6px; cursor: pointer; }
    video { width: 100%; background: #000; border: 2px inset #808080; margin-top: 2px; }
    .alarm-message { padding: 30px; font-size: 2rem; color: #d00; font-weight: bold; text-shadow: 2px 2px #fff;}

    /* YouTube iframe直埋め込み用（画面外に隠す） */
    #yt-container { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; overflow: hidden; }
  </style>
</head>
<body>

  <!-- iframe直埋め込み用コンテナ -->
  <div id="yt-container">
    <iframe id="yt-iframe" src="" allow="autoplay" style="width:100px; height:100px;"></iframe>
  </div>

  <audio id="bgm-audio" loop></audio>

  <div id="start-screen">
    <button id="enter-btn">ENTER SYSTEM</button>
  </div>

  <canvas id="visualizer"></canvas>

  <div id="ui-layer">
    
    <div id="clock-container">
      <div id="date-display">2026/00/00 mon.</div>
      <div id="time-display">00:00:00</div>
    </div>

    <div class="control-panel">
      <div class="panel-row">
        <span>ALARM:</span>
        <input type="time" id="alarm-time" style="flex:1;">
        <button id="alarm-set-btn">SET</button>
      </div>
      <div id="alarm-status">OFF</div>
      <hr style="border-top:1px solid #808080; border-bottom:1px solid #fff; margin: 8px 0;">
      
      <div class="panel-row">
        <span>BGM :</span>
        <select id="bgm-mode" style="flex:1;">
          <option value="preset">プリセット(雨音)</option>
          <option value="youtube">YouTubeリンク</option>
        </select>
      </div>

      <div class="yt-panel" id="yt-panel" style="display: none;">
        <div class="yt-row">
          <input type="text" id="yt-input" placeholder="YouTubeのURLをペースト">
          <button id="yt-load-btn">LOAD</button>
        </div>
        <div id="yt-status">Status: Waiting</div>
      </div>
      
      <div class="panel-row" style="margin-top:8px;">
        <span>AREA :</span>
        <select id="area-select" style="flex:1;">
          <option value="chofu">調布</option>
          <option value="koriyama">郡山</option>
          <option value="tama">多摩</option>
        </select>
      </div>

      <div class="mute-tabs" id="mute-tabs">
        <div class="mute-tab active" data-state="all">全乗せ</div>
        <div class="mute-tab" data-state="bgmonly">自発OFF</div>
        <div class="mute-tab" data-state="mute">全Mute</div>
      </div>
    </div>

    <div class="voice-btn-base">
      <div class="voice-btn-label">RANDOM VOICE</div>
      <button id="random-voice-btn">🟢</button>
    </div>

    <div class="weather-panel">
      <div class="weather-box">
        <div class="w-label">CURRENT (<span id="loc-name">---</span>)</div>
        <div class="w-temp" id="curr-temp">--°C</div>
        <div class="w-desc" id="curr-desc">--</div>
      </div>
      <div class="weather-divider"></div>
      <div class="weather-box">
        <div class="w-label">+6 HOURS LATER</div>
        <div class="w-temp" id="future-temp">--°C</div>
        <div class="w-desc" id="future-desc">--</div>
      </div>
    </div>

    <div class="ad-banner-h" onclick="alert('スポンサー様、お待ちしております！')">
      YOUR AD HERE - 広告主募集中!
    </div>

  </div>

  <div id="movie-overlay" class="overlay">
    <div class="window-box">
      <div class="window-title-bar"><span id="video-title">Event_Viewer.exe</span><span class="window-close" onclick="closeMovie()">x</span></div>
      <video id="hourly-movie" playsinline></video>
    </div>
  </div>

  <div id="alarm-overlay" class="overlay">
    <div class="window-box">
      <div class="window-title-bar"><span>Alarm.exe</span><span class="window-close" onclick="closeAlarm()">x</span></div>
      <div class="alarm-message">WAKE UP!</div>
    </div>
  </div>

  <script>
    const testAssets = {
      voice: "https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg",
      alarm: "https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg",
      movie: "https://www.w3schools.com/html/mov_bbb.mp4",
      presetBgm: "https://actions.google.com/sounds/v1/water/rain_on_roof.ogg"
    };

    let muteState = 'all';
    let currentArea = 'chofu';
    let alarmTime = null;
    let alarmHasTriggered = false;
    let bgmMode = 'preset';
    
    const bgmAudio = document.getElementById('bgm-audio');
    bgmAudio.src = testAssets.presetBgm;
    let alarmSound = new Audio(testAssets.alarm); alarmSound.loop = true;
    const ytIframe = document.getElementById('yt-iframe');

    function extractVideoID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function updateBGM() {
      if (muteState === 'all' || muteState === 'bgmonly') {
        if (bgmMode === 'preset') {
          ytIframe.src = ""; // YouTubeを止める
          bgmAudio.play().catch(e => {});
        } else if (bgmMode === 'youtube') {
          bgmAudio.pause();
          // すでにsrcが入っていればそのまま、入っていなければ何もしない
        }
      } else {
        bgmAudio.pause();
        ytIframe.src = "";
      }
    }

    document.getElementById('enter-btn').addEventListener('click', () => {
      document.getElementById('start-screen').style.display = 'none';
      updateBGM();
      fetchWeather();
    });

    document.getElementById('bgm-mode').addEventListener('change', (e) => {
      bgmMode = e.target.value;
      if (bgmMode === 'youtube') {
        document.getElementById('yt-panel').style.display = 'flex';
      } else {
        document.getElementById('yt-panel').style.display = 'none';
        ytIframe.src = "";
      }
      updateBGM();
    });

    document.getElementById('yt-load-btn').addEventListener('click', () => {
      const url = document.getElementById('yt-input').value;
      const vidId = extractVideoID(url);
      const statusEl = document.getElementById('yt-status');
      if (vidId) {
        statusEl.textContent = `Status: Loaded (${vidId})`;
        statusEl.style.color = '#0f0';
        // PC版埋め込みパラメータ (autoplay=1, loop=1, playlist=動画ID)
        ytIframe.src = `https://www.youtube.com/embed/${vidId}?autoplay=1&loop=1&playlist=${vidId}`;
        updateBGM();
      } else {
        statusEl.textContent = "Status: Invalid URL";
        statusEl.style.color = '#f00';
      }
    });

    document.querySelectorAll('.mute-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.mute-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        muteState = e.target.dataset.state;
        updateBGM();
      });
    });

    document.getElementById('alarm-set-btn').addEventListener('click', () => {
      const input = document.getElementById('alarm-time').value;
      if (input) {
        alarmTime = input; alarmHasTriggered = false;
        document.getElementById('alarm-status').textContent = `SET [${alarmTime}]`;
        document.getElementById('alarm-status').style.color = '#00f';
      } else {
        alarmTime = null;
        document.getElementById('alarm-status').textContent = 'OFF';
        document.getElementById('alarm-status').style.color = '#d00';
      }
    });

    document.getElementById('random-voice-btn').addEventListener('click', () => {
      if (muteState === 'mute') return;
      new Audio(testAssets.voice).play().catch(e => {});
    });

    function getWeatherCodeDesc(code) {
      if(code === 0) return "晴れ";
      if(code > 0 && code <= 3) return "曇り";
      if(code >= 51 && code <= 67) return "雨";
      if(code >= 71 && code <= 77) return "雪";
      return "不明";
    }

    async function fetchWeather() {
      try {
        const geoRes = await fetch('https://ipapi.co/json/');
        const geoData = await geoRes.json();
        const lat = geoData.latitude; const lon = geoData.longitude;
        document.getElementById('loc-name').textContent = geoData.city || "Unknown";

        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode`);
        const data = await weatherRes.json();
        
        document.getElementById('curr-temp').textContent = `${data.current_weather.temperature}°C`;
        document.getElementById('curr-desc').textContent = getWeatherCodeDesc(data.current_weather.weathercode);
        
        const nowStr = data.current_weather.time;
        const index = data.hourly.time.findIndex(t => t === nowStr);
        if(index !== -1 && data.hourly.time[index + 6]) {
          document.getElementById('future-temp').textContent = `${data.hourly.temperature_2m[index + 6]}°C`;
          document.getElementById('future-desc').textContent = getWeatherCodeDesc(data.hourly.weathercode[index + 6]);
        }
      } catch (err) {
        document.getElementById('loc-name').textContent = "Offline";
      }
    }

    const dayNames = ['sun.', 'mon.', 'tue.', 'wed.', 'thu.', 'fri.', 'sat.'];
    setInterval(() => {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0'); const m = String(now.getMinutes()).padStart(2, '0'); const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('date-display').textContent = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${dayNames[now.getDay()]}`;
      document.getElementById('time-display').textContent = `${h}:${m}:${s}`;

      if (alarmTime && `${h}:${m}` === alarmTime && s === '00' && !alarmHasTriggered) {
        alarmHasTriggered = true; triggerAlarm();
      }

      if (m === '00' && s === '00') {
        if (muteState !== 'mute') {
          if (muteState === 'all') new Audio(testAssets.voice).play();
          const hv = document.getElementById('hourly-movie');
          hv.src = testAssets.movie;
          document.getElementById('movie-overlay').style.display = 'flex';
          hv.play();
        }
      }
    }, 1000);

    function triggerAlarm() { if (muteState !== 'mute') alarmSound.play(); document.getElementById('alarm-overlay').style.display = 'flex'; }
    function closeAlarm() { document.getElementById('alarm-overlay').style.display = 'none'; alarmSound.pause(); alarmSound.currentTime = 0; }
    function closeMovie() { document.getElementById('movie-overlay').style.display = 'none'; document.getElementById('hourly-movie').pause(); }

    const canvas = document.getElementById('visualizer'); const ctx = canvas.getContext('2d');
    let width, height; let particles = []; let mouse = { x: -1000, y: -1000 }; let hue = 0;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    canvas.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
    canvas.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });
    class Particle {
      constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 2; this.vy = (Math.random() - 0.5) * 2; }
      update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1;
        let dx = mouse.x - this.x; let dy = mouse.y - this.y; if (Math.sqrt(dx * dx + dy * dy) < 100) { this.x -= dx * 0.05; this.y -= dy * 0.05; } }
    }
    for (let i = 0; i < 70; i++) particles.push(new Particle());
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, width, height);
      hue += 0.5; if (hue >= 360) hue = 0; ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`; ctx.lineWidth = 1.5;
      for (let i = 0; i < particles.length; i++) { particles[i].update(); for (let j = i + 1; j < particles.length; j++) { let dx = particles[i].x - particles[j].x; let dy = particles[i].y - particles[j].y;
          if (Math.sqrt(dx*dx + dy*dy) < 120) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); } } }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
